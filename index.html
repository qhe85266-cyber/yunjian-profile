<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

          <li>JavaScript</li>

      <section class="card">
        <h2>联系方式</h2>
        <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
        <p>GitHub: <a href="https://github.com/qhe85266-cyber" target="_blank" rel="noopener noreferrer">github.com</a></p>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> 云笺名片</p>
    </footer>
  </div>

  <script src="script.js"></script>

</html>
